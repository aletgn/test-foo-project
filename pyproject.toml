[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "testfooproject"
version = "0.0.21"
description = "TEST"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "aletgn"}]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT license",
    "Operating System :: OS Independent",
]
keywords = ["test", "example", "python"]

[project.urls]
Homepage = "https://github.com/aletgn/test-foo-project"
Repository = "https://github.com/aletgn/test-foo-project"
Documentation = "https://github.com/aletgn/test-foo-project#readme"

[project.optional-dependencies]
test = ["notebook"]
dev = ["pytest", "twine", "setuptools", "build"]

[tool.setuptools.packages.find]
where = ["src"]
